<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Targeting Math Quest - ACR Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b1120;
      --padlet-blue: #00d2ff;
      --padlet-pink: #ff0055;
      --padlet-yellow: #ffc43d;
      --card-cream: #fffdf5;
      --text-dark: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Segoe UI', sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      overflow: hidden;
    }

    /* FULLSCREEN EMBED CONTAINER */
    #game-frame-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ONBOARDING & OVERLAY MODALS */
    .overlay-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 17, 32, 0.95);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-card {
      background: var(--card-cream);
      color: var(--text-dark);
      width: 100%;
      max-width: 440px;
      padding: 24px;
      border-radius: 24px;
      border: 4px solid var(--padlet-blue);
      box-shadow: 0 10px 0 var(--padlet-blue);
      position: relative;
    }

    .modal-title {
      color: var(--padlet-pink);
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 4px;
    }

    .modal-sub {
      text-align: center;
      color: #64748b;
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-row {
      display: flex;
      gap: 8px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #334155;
    }

    input, select {
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid #cbd5e1;
      font-size: 0.95rem;
      background: #ffffff;
      width: 100%;
    }

    .pill-btn {
      width: 100%;
      padding: 12px;
      border-radius: 30px;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }

    .btn-pink { background: var(--padlet-pink); color: white; }
    .btn-yellow { background: var(--padlet-yellow); color: var(--text-dark); }
    .btn-ghost { background: transparent; border: 2px solid #cbd5e1; color: #64748b; }

    /* FLOATING OVERLAY BAR FOR ACADEMIC LOGGING */
    .academic-topbar {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 500;
      display: flex;
      gap: 8px;
    }

    .bar-btn {
      background: rgba(15, 23, 42, 0.85);
      color: white;
      border: 2px solid var(--padlet-blue);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>

  <!-- FLOATING HUD BAR (Teacher & Data Sync Controls) -->
  <div class="academic-topbar">
    <button class="bar-btn" onclick="openTeacherModal()">Teacher Mode</button>
    <button class="bar-btn" onclick="openOnboarding()">Change Profile</button>
  </div>

  <!-- ONBOARDING GATE (Gathers Telemetry Before Launch) -->
  <div id="gate-modal" class="overlay-modal">
    <div class="modal-card">
      <h2 class="modal-title">TARGETING MATH QUEST</h2>
      <p class="modal-sub">Assumption College Rayong Edition</p>

      <form onsubmit="event.preventDefault(); launchGame();">
        <div class="form-row">
          <div class="form-group">
            <label>Grade Level</label>
            <select id="st-grade" required>
              <option value="P5">Primary 5</option>
              <option value="P6">Primary 6</option>
            </select>
          </div>
          <div class="form-group">
            <label>Semester</label>
            <select id="st-sem" required>
              <option value="1">Semester 1</option>
              <option value="2">Semester 2</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>Full Student Name</label>
          <input type="text" id="st-name" placeholder="George Miguel" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Section</label>
            <input type="text" id="st-section" placeholder="5/1" required>
          </div>
          <div class="form-group">
            <label>Student ID</label>
            <input type="text" id="st-id" placeholder="50612" required>
          </div>
        </div>

        <button type="submit" class="pill-btn btn-pink">Launch Game Quest</button>
      </form>
    </div>
  </div>

  <!-- TEACHER ADMIN MODAL -->
  <div id="teacher-modal" class="overlay-modal" style="display:none;">
    <div class="modal-card">
      <h2 class="modal-title">Teacher Portal</h2>
      <p class="modal-sub">Enter Access PIN</p>

      <div id="teacher-lock">
        <input type="password" id="teacher-pin" placeholder="Enter PIN (ACR2026)" style="margin-bottom: 12px;">
        <button class="pill-btn btn-yellow" onclick="verifyPIN()">Unlock Portal</button>
        <button class="pill-btn btn-ghost" onclick="closeTeacherModal()" style="margin-top:6px;">Close</button>
      </div>

      <div id="teacher-controls" style="display:none;">
        <p style="font-size:0.85rem; margin-bottom:10px;"><b>Telemetry Connected:</b> Google Sheets Data Sync Active</p>
        <button class="pill-btn btn-pink" onclick="alert('Focus Aura Activated (+5% XP for Class)')">Trigger Focus Aura Multiplier</button>
        <button class="pill-btn btn-ghost" onclick="closeTeacherModal()" style="margin-top:8px;">Back to Game</button>
      </div>
    </div>
  </div>

  <!-- REAL PADLET ARCADE ENGINE EMBED -->
  <div id="game-frame-container">
    <iframe 
      id="padlet-game-frame"
      src="https://arcade.padlet.com/game/5K5M8Jk0KY" 
      allow="autoplay; fullscreen; microphone; camera; geolocation" 
      allowfullscreen>
    </iframe>
  </div>

  <script>
    // GOOGLE APPS SCRIPT WEB APP URL (Add your endpoint here)
    const GOOGLE_SHEETS_SCRIPT_URL = "";

    function launchGame() {
      const studentData = {
        name: document.getElementById('st-name').value,
        grade: document.getElementById('st-grade').value,
        sem: document.getElementById('st-sem').value,
        section: document.getElementById('st-section').value,
        studentId: document.getElementById('st-id').value,
        timestamp: new Date().toISOString()
      };

      // Save locally
      localStorage.setItem('acr_student_profile', JSON.stringify(studentData));

      // Sync to Google Sheets cloud telemetry backend
      if (GOOGLE_SHEETS_SCRIPT_URL) {
        fetch(GOOGLE_SHEETS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(studentData)
        }).catch(err => console.log('Sync offline'));
      }

      // Hide onboarding and display full Padlet game
      document.getElementById('gate-modal').style.display = 'none';
    }

    function openOnboarding() {
      document.getElementById('gate-modal').style.display = 'flex';
    }

    function openTeacherModal() {
      document.getElementById('teacher-modal').style.display = 'flex';
    }

    function closeTeacherModal() {
      document.getElementById('teacher-modal').style.display = 'none';
    }

    function verifyPIN() {
      const pin = document.getElementById('teacher-pin').value;
      if (pin === 'ACR2026') {
        document.getElementById('teacher-lock').style.display = 'none';
        document.getElementById('teacher-controls').style.display = 'block';
      } else {
        alert('Invalid Teacher PIN!');
      }
    }
  </script>
</body>
</html>
