<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Targeting Math Quest - ACR Edition</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14307a">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</head>
<body>
  <div id="app">
    <!-- START SCREEN -->
    <div id="screen-start" class="screen active">
      <div class="start-inner">
        <div class="sym s1">%</div>
        <div class="sym s2">+</div>
        <div class="sym s3">×</div>
        <div class="sym s4">÷</div>
        <div class="sym s5">=</div>
        <div class="sym s6">√</div>
        <h1 id="game-title">Targeting Math Quest</h1>
        <div id="instructions">
          Conquer Math at <span class="hl">Assumption College Rayong</span>
        </div>
        <div class="creator">Created by <b>Master George Cedrick Miguel</b></div>
        <div class="start-btns">
          <button id="btn-start" class="btn btn-primary" onclick="startGame()">Start Quest</button>
          <div class="start-alt">
            <button id="btn-free" class="btn btn-ghost" onclick="startGuestMode()">
              <span class="bf-main">Free Play</span>
              <span class="bf-sub">No sign-in required</span>
            </button>
            <button id="btn-duo" class="btn btn-ghost" onclick="startDuoMode()">
              <span class="bf-main">Duo Quest</span>
              <span class="bf-sub">Share one device</span>
            </button>
          </div>
          <button class="btn btn-dev" onclick="toggleRestoreModal()">Enter Save Code / PIN</button>
        </div>
      </div>
    </div>

    <!-- PLAY SCREEN -->
    <div id="screen-play" class="screen">
      <div id="hud">
        <div class="hud-row">
          <div class="lvl-badge">LVL <span id="hud-level">1</span></div>
          <div class="xp-wrap">
            <div class="bar xp-bar"><div id="xp-fill" class="fill" style="width:0%"></div></div>
          </div>
          <div class="score-box">XP: <span id="score">0</span></div>
        </div>
        <div class="hud-row hud-stats">
          <div class="stat"><span class="stat-lbl">HP</span><div class="bar hp-bar"><div id="hp-fill" class="fill" style="width:100%"></div></div></div>
          <div class="stat"><span class="stat-lbl">MP</span><div class="bar mp-bar"><div id="mp-fill" class="fill" style="width:100%"></div></div></div>
        </div>
      </div>

      <div id="stage">
        <div id="zone-tag"><span id="zone-text">Week 1: Whole Numbers</span></div>
        <div id="float-layer"></div>
      </div>

      <!-- BATTLE CARD OVERLAY -->
      <div id="battle">
        <div class="b-top">
          <div class="foe-info">
            <div class="foe-name" id="foe-name">Math Boss</div>
            <div class="bar foe-bar"><div id="foe-hp-fill" class="fill" style="width:100%"></div></div>
            <div class="foe-sub" id="foe-sub">Grade 5 Challenge</div>
          </div>
        </div>
        <div class="b-mid">
          <div class="q-card">
            <div class="q-text" id="q-text">Loading question...</div>
            <div class="choices" id="choices-box"></div>
            <div class="feedback" id="feedback"></div>
          </div>
        </div>
        <div class="b-bot">
          <button class="btn btn-skill" onclick="manualSave()">💾 Save Progress</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
